<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href /play/` (tool/build_web.sh). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Play Alchemons</title>
  <meta name="description" content="Play Alchemons free in your browser: extract, breed and fuse Alchemons, explore the wild and the cosmos.">
  <meta name="theme-color" content="#09090b">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Play Alchemons">
  <meta property="og:description" content="Free in your browser. Extract, breed and fuse Alchemons.">
  <meta property="og:url" content="https://alchemons.com/play/">
  <meta property="og:image" content="https://alchemons.com/assets/brand/og.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Alchemons">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shell.css">
  <!-- The site's store links (alchemons-web/js/stores.js); absolute, so it
       resolves past the /play/ base. Missing locally: the game still runs. -->
  <script src="/js/stores.js"></script>
</head>
<body>
  <canvas id="sand" aria-hidden="true"></canvas>

  <div class="rail-ad" id="ad-left"><span class="ad-label">Advertisement</span><div class="ad-box"></div></div>
  <div class="rail-ad" id="ad-right"><span class="ad-label">Advertisement</span><div class="ad-box"></div></div>

  <main id="column">
    <div id="game"></div>
    <div id="gate">
      <img class="gate-logo" src="brand/logo.webp" alt="Alchemons" width="884" height="219">
      <button id="play" type="button" disabled>Loading</button>
      <p class="gate-note">Free to play in your browser. Your save stays in this browser; sign in from your profile in the game to back it up.</p>
      <div class="gate-apps">
        <span class="gate-apps-title">Plays best in the app</span>
        <div class="gate-apps-row">
          <a class="gate-store" data-store="ios" rel="noopener" target="_blank">iPhone &amp; iPad</a>
          <a class="gate-store" data-store="android" rel="noopener" target="_blank">Android</a>
        </div>
        <span class="gate-apps-note" id="gate-apps-note"></span>
      </div>
      <nav class="gate-links" aria-label="Site">
        <a href="/">Alchemons.com</a>
        <a href="/privacy/">Privacy</a>
      </nav>
    </div>
  </main>

  <div id="bottom-ad"></div>

  <script src="ads/config.js"></script>
  <script src="ads/ads.js"></script>
  <script src="sand/star_sand.js"></script>
  <script src="shell.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
