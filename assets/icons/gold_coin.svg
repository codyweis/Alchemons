<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="goldFace" cx="0.35" cy="0.28" r="0.95">
      <stop offset="0%" stop-color="#FFF1B0"/>
      <stop offset="35%" stop-color="#FFD358"/>
      <stop offset="75%" stop-color="#C8841C"/>
      <stop offset="100%" stop-color="#6B3A04"/>
    </radialGradient>
    <linearGradient id="goldRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE38A"/>
      <stop offset="55%" stop-color="#9F6611"/>
      <stop offset="100%" stop-color="#4C2A02"/>
    </linearGradient>
    <radialGradient id="goldShine" cx="0.32" cy="0.22" r="0.35">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- outer rim -->
  <circle cx="32" cy="32" r="30" fill="url(#goldRim)"/>
  <!-- bevel inset -->
  <circle cx="32" cy="32" r="27.5" fill="#3A2002" opacity="0.55"/>
  <!-- coin face -->
  <circle cx="32" cy="32" r="26" fill="url(#goldFace)"/>
  <!-- inner ring detail -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#5A360A" stroke-width="0.6" opacity="0.5"/>
  <!-- alchemical sun: circle + dot -->
  <circle cx="32" cy="32" r="8.5" fill="none" stroke="#3A2002" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="32" cy="32" r="2.2" fill="#3A2002"/>
  <!-- top highlight shine -->
  <circle cx="32" cy="32" r="26" fill="url(#goldShine)"/>
</svg>
